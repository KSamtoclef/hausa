name: Remove Supabase form dependency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-supabase-form.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Supabase save call from form flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '        async function saveRegistration(phone) {'
          next_marker = '        $("#confirm").click'

          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('saveRegistration function not found')

          end = text.find(next_marker, start)
          if end == -1:
              raise SystemExit('confirm click handler not found')

          replacement = '''        async function saveRegistration(phone) {\n            return true;\n        }\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit form fix and remove helper workflow
        run: |
          rm -f .github/workflows/remove-supabase-form.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-supabase-form.yml
          git commit -m "Remove Supabase dependency from registration flow"
          git push
