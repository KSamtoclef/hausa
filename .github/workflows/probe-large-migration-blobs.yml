name: Probe large migration blobs

on:
  push:
    branches: [main]
    paths:
      - '.large-blob-probe-trigger'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check larger exact migration blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/blob-list <<'EOF'
          00 2d076affddc65ce7379f1d451bbe5cd0a79a2c0a
          01 240da99b1df229016d6d1dd3311e0b40e2b3af6f
          02 54bc11e413dbf3412331695e8ee9922dffc7987b
          03 8a040cc0ccf79feb5e30428d47868f728a1ef3f2
          04 591dda4a46c8ec30c90c9d516e0038fafc796d09
          05 3812b109fb06272d8802a009c8551112ed8a27cd
          06 e34815e3f496ddbe04c042714643f059fa892851
          07 bd677ef69b4503d0c823e6511039d17becd88b4d
          08 496793e082309da0901cfe22d2ead13eb760895f
          09 1a94e2c40125b6f5f5014dd5ae586abfc59d0957
          10 a7213d43f26eb677ccde0fc49748e2b84a418ae8
          11 6384f6c7ceb9ef8248e7c1b415bd71786ad806dc
          12 16f855fdee1478f5883c038f84a39b0307e92a3d
          13 915c1b6a6b1c32854e7e01dd7ada47f34ad15e0a
          14 e22e19f60b29290c175e733d2442ce86d8295515
          15 e33344262fb0076260ae1419efd0f309a7af1bbf
          16 ac667559d6923085bb8c47abd45e729c4348b40a
          17 e2ba9112d7eecdc696e326500a5bcd7987366c46
          18 a6702a7f2086c721c56d0d93c27698425761c68c
          19 d16f65fa046d440596050719f2b273e6da82ed69
          EOF
          : > .large-blob-found
          : > .large-blob-misses
          while read -r idx sha; do
            code=$(curl -sS -o /tmp/blob.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha")
            if [ "$code" = "200" ]; then echo "$idx $sha" >> .large-blob-found; else echo "$idx $sha" >> .large-blob-misses; fi
          done < /tmp/blob-list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .large-blob-found .large-blob-misses
          git commit -m 'Record large migration blob availability'
          git push
