name: Add analytics codes
on:
  push:
    paths:
      - '.github/workflows/add-analytics-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          targets = [Path('index.html'), Path('Samu Kyautar 30GB Data A Kowane Layi.html')]
          anchor = '<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">'
          data = ''
          block = base64.b64decode(data).decode()
          for p in targets:
              text = p.read_text()
              if '277386131662358' not in text and 'xzcnrxxrpo' not in text:
                  text = text.replace(anchor, anchor + '\n' + block, 1)
                  p.write_text(text)
          PY
      - name: Save changes
        run: |
          rm -f .github/workflows/add-analytics-v2.yml .github/workflows/add-meta-clarity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Meta Pixel and Microsoft Clarity'
          git push origin HEAD:main
