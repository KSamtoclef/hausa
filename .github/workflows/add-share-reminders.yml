name: Add share reminders
on:
  push:
    paths:
      - '.github/workflows/add-share-reminders.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reminders at 3rd and 7th share attempts only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          msg = "Shin ka raba da gaske? Ka tabbata ka raba kafin ka ci gaba."
          marker3 = "share-reminder-third"
          marker7 = "share-reminder-seventh"
          if marker3 not in s:
              pat3 = r'(else if\s*\(width\s*==\s*65\)\s*\{\s*)'
              rep3 = r'\1\n                // share-reminder-third\n                alert("' + msg + r'");\n                '
              s, n3 = re.subn(pat3, rep3, s, count=1)
              if n3 != 1:
                  raise SystemExit('3rd share branch not found')
          if marker7 not in s:
              pat7 = r'(else if\s*\(width\s*==\s*87\)\s*\{\s*)'
              rep7 = r'\1\n                // share-reminder-seventh\n                alert("' + msg + r'");\n                '
              s, n7 = re.subn(pat7, rep7, s, count=1)
              if n7 != 1:
                  raise SystemExit('7th share branch not found')
          p.write_text(s)
          PY
      - name: Commit exact reminder change and remove helper
        run: |
          rm -f .github/workflows/add-share-reminders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-share-reminders.yml
          git commit -m "Add share reminders at 3rd and 7th attempts" || exit 0
          git push
