name: Temporarily bypass Supabase registration

on:
  push:
    paths:
      - '.github/workflows/remove-supabase-registration.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove Supabase from form submission
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          original = text

          # Remove the Supabase save helper only.
          start = text.find('async function saveRegistration(phone)')
          click = text.find('$("#confirm").click(async function()', start)
          if start == -1 or click == -1:
              raise SystemExit('Expected registration save block not found; no changes made')
          text = text[:start] + text[click:]

          # Remove the save-error reset.
          text, n1 = re.subn(r'\s*\$\("#saveError"\)\.hide\(\);', '', text, count=1)
          if n1 != 1:
              raise SystemExit('Expected saveError hide line not found; no changes committed')

          # Remove the await/save/failure block but keep phone validation and the normal next-step flow.
          pattern = re.compile(
              r'\s*\$\(this\)\.prop\("disabled", true\);\s*'
              r'var stored = await saveRegistration\(phone\);\s*'
              r'\$\(this\)\.prop\("disabled", false\);\s*'
              r'if \(!stored\) \{\s*'
              r'\$\("#saveError"\)\.fadeIn\(500\);\s*'
              r'return;\s*\}',
              re.S
          )
          text, n2 = pattern.subn('', text, count=1)
          if n2 != 1:
              raise SystemExit('Expected Supabase submission block not found; no changes committed')

          # Remove the now-unused visible save-error element only.
          text = re.sub(r'\s*<p class="error" id="saveError">.*?</p>', '', text, count=1, flags=re.S)

          if 'saveRegistration(phone)' in text or 'register_anniversary_user' in text:
              raise SystemExit('Supabase registration code still present; refusing partial edit')
          if text == original:
              raise SystemExit('No changes made')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit site update and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-supabase-registration.yml
          git commit -m "Temporarily remove Supabase form dependency"
          git push origin main
