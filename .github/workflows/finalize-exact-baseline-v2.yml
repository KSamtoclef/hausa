name: Finalize exact baseline v2

on:
  push:
    branches: [main]
    paths: ['.finalize-v2-trigger']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate exact supplied baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          from html import unescape
          import hashlib, re

          source_url='https://25gb-anniversary-data.altcore.online/'
          page_name='Samu Kyautar 30GB Data A Kowane Layi.html'
          asset_dir_name='Samu Kyautar 30GB Data A Kowane Layi_files'
          target_html_sha='cac5301dc0d65d6ef9e817685b1c2284ae58195e93f089aab81e1401504adcb3'
          expected={
            '0UHB1f0.png':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            '25.png':'0186ef7eb7181b66aaf8565acc8ea9d83b7a1307db06561858d8ce66c5295a32',
            'D3BlBjV.jpg':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'KTvWL6j.jpg':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'g6cV61A.png':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'jquery-latest.min.js.download':'540bc6e5724079cd71ea4e72a2bc1f67ef2f6fe59ad0eb4814dd3525ac46f41f',
            'js':'5053a44bc0cd29ba0890f34686e9642861575fb73f6f38cff8a0f4e1c78bea3',
            'sSMYbTT.png':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'v4513226cdae34746b4dedf0b4dfa099e1781791509496':'e1ac7d6bb3f8916e3eac8078e341d207e84cd6f0fc90c31d2f5e65640f5e0fbf',
            'xp1ER6K.jpg':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
          }

          def fetch(url):
            req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urlopen(req,timeout=20) as r: return r.read()

          raw=fetch(source_url)
          text=raw.decode('utf-8','replace')
          urls=set()
          for m in re.finditer(r'''(?i)(?:src|href|content)\s*=\s*["']([^"']+)["']''',text):
            v=unescape(m.group(1).strip())
            if not v or v.startswith(('data:','javascript:','#','mailto:','tel:')): continue
            if v.startswith('//'): v='https:'+v
            urls.add(urljoin(source_url,v))
          for m in re.finditer(r'''https?://[^\s"'<>]+''',text): urls.add(unescape(m.group(0).rstrip(');,]')))
          for name in expected:
            urls.add(urljoin(source_url,name))
            urls.add(urljoin(source_url,name.replace('.download','')))
          urls.update({
            'https://code.jquery.com/jquery-1.11.1.min.js',
            'https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js',
            'https://www.googletagmanager.com/gtag/js?id=G-4JTHD1T1H0',
            'https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496',
          })

          wanted=set(expected.values())
          by_hash={}; source_for={}
          for cache_dir in (Path('.real-cache'),Path('.source-cache')):
            if cache_dir.exists():
              for p in cache_dir.iterdir():
                if p.is_file():
                  b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
                  if h in wanted: by_hash.setdefault(h,b)
          for u in sorted(urls):
            if wanted.issubset(by_hash): break
            try: b=fetch(u)
            except Exception: continue
            h=hashlib.sha256(b).hexdigest()
            if h in wanted and h not in by_hash:
              by_hash[h]=b; source_for[h]=u
          missing=sorted({h for h in wanted if h not in by_hash})
          if missing: raise SystemExit('Missing exact supplied hashes: '+','.join(missing))

          ad=Path(asset_dir_name); ad.mkdir(exist_ok=True)
          for name,h in expected.items():
            (ad/name).write_bytes(by_hash[h])
            if hashlib.sha256((ad/name).read_bytes()).hexdigest()!=h: raise SystemExit('hash fail '+name)

          mappings={}
          for name,h in expected.items():
            if h in source_for: mappings[source_for[h]]=f'./{asset_dir_name}/{name}'
            mappings[urljoin(source_url,name)]=f'./{asset_dir_name}/{name}'
            mappings[urljoin(source_url,name.replace('.download',''))]=f'./{asset_dir_name}/{name}'
          base=text
          for src,dst in sorted(mappings.items(),key=lambda kv:len(kv[0]),reverse=True):
            base=base.replace(src,dst).replace(src.replace('&','&amp;'),dst)
          base=re.sub(r'(?is)(<title[^>]*>).*?(</title>)',r'\1Demo - Samu Kyautar 30GB Data A Kowane Layi\2',base,count=1)

          saved=f'<!-- saved from url=({len(source_url):04d}){source_url} -->'
          ctype='<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">'
          candidates=[]
          def add(x):
            if x not in candidates: candidates.append(x)
          add(base)
          for nl in ('\n','\r\n'):
            add(re.sub(r'(?is)(<!doctype[^>]*>)',r'\1'+nl+saved,base,count=1))
          for v in list(candidates):
            for nl in ('','\n','\r\n'):
              add(re.sub(r'(?is)(<head[^>]*>)',r'\1'+nl+ctype,v,count=1))
          for v in list(candidates):
            add(v.replace('\r\n','\n'))
            add(v.replace('\r\n','\n').replace('\n','\r\n'))
          chosen=None
          for v in candidates:
            b=v.encode('utf-8')
            if hashlib.sha256(b).hexdigest()==target_html_sha: chosen=b; break
          if chosen is None: raise SystemExit('Exact supplied HTML snapshot hash not reconstructed')
          Path(page_name).write_bytes(chosen)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          expected={
            'Samu Kyautar 30GB Data A Kowane Layi.html':'cac5301dc0d65d6ef9e817685b1c2284ae58195e93f089aab81e1401504adcb3',
            'Samu Kyautar 30GB Data A Kowane Layi_files/0UHB1f0.png':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'Samu Kyautar 30GB Data A Kowane Layi_files/25.png':'0186ef7eb7181b66aaf8565acc8ea9d83b7a1307db06561858d8ce66c5295a32',
            'Samu Kyautar 30GB Data A Kowane Layi_files/D3BlBjV.jpg':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'Samu Kyautar 30GB Data A Kowane Layi_files/KTvWL6j.jpg':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'Samu Kyautar 30GB Data A Kowane Layi_files/g6cV61A.png':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'Samu Kyautar 30GB Data A Kowane Layi_files/jquery-latest.min.js.download':'540bc6e5724079cd71ea4e72a2bc1f67ef2f6fe59ad0eb4814dd3525ac46f41f',
            'Samu Kyautar 30GB Data A Kowane Layi_files/js':'5053a44bc0cd29ba0890f34686e9642861575fb73f6f38cff8a0f4e1c78bea3',
            'Samu Kyautar 30GB Data A Kowane Layi_files/sSMYbTT.png':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
            'Samu Kyautar 30GB Data A Kowane Layi_files/v4513226cdae34746b4dedf0b4dfa099e1781791509496':'e1ac7d6bb3f8916e3eac8078e341d207e84cd6f0fc90c31d2f5e65640f5e0fbf',
            'Samu Kyautar 30GB Data A Kowane Layi_files/xp1ER6K.jpg':'5baf815b9c2b747c272b95f284c40d32e1f4d9ba13eeff6db81831a12d61829f',
          }
          for p,h in expected.items():
            if not Path(p).is_file() or hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h: raise SystemExit('Final manifest failed: '+p)
          PY

      - name: Commit baseline and restore branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github .migration-init .payload .source-* .real-* .probe-* .finalize-*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Baseline original duplicate'
          git push origin HEAD:main
          git push --force origin HEAD:refs/heads/baseline-original-duplicate
