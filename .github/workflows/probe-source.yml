name: Verify supplied asset sources

on:
  push:
    branches: [main]
    paths:
      - '.source-probe'

permissions:
  contents: write

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record byte-identical source matches
        shell: bash
        run: |
          set -u
          : > .source-match-results

          check() {
            name="$1"
            expected="$2"
            shift 2
            matched=''
            for url in "$@"; do
              rm -f /tmp/source-probe.bin
              if curl -fsSL --retry 1 --connect-timeout 10 "$url" -o /tmp/source-probe.bin; then
                actual="$(sha256sum /tmp/source-probe.bin | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  matched="$url"
                  break
                fi
              fi
            done
            if [ -n "$matched" ]; then
              printf '%s|MATCH|%s\n' "$name" "$matched" >> .source-match-results
            else
              printf '%s|MISS\n' "$name" >> .source-match-results
            fi
          }

          base='https://25gb-anniversary-data.altcore.online'
          check '25.png' '0186ef7eb7181b66aaf8565acc8ea9d83b7a1307db06561858d8ce66c5295a32' "$base/25.png"
          check '0UHB1f0.png' 'ceabbfc35f1d7a9c0f6aa3a02b540b4343015863cb109eb15ff3253da3809376' "$base/0UHB1f0.png"
          check 'D3BlBjV.jpg' '1e48a7664155ba996f433237517509610a383b7339eb76b39883dc52433999a0' "$base/D3BlBjV.jpg"
          check 'KTvWL6j.jpg' '22fcfd691c6e6fb1f7c11a8221a73c85e4df82157a5fcc4788d9f5122207a92e' "$base/KTvWL6j.jpg"
          check 'g6cV61A.png' 'a9e016f11bc71f12128811f0ab6022e4d7f68dc75bde3e931b245a1f41749666' "$base/g6cV61A.png"
          check 'sSMYbTT.png' '01f4dd5a6f6b5b16917c38b777efca84efe1ca9ccb0829867bcde0f7e398aa85' "$base/sSMYbTT.png"
          check 'xp1ER6K.jpg' 'ce5734493a44bc0cd29ba0890f34686e9642861575fb73f6f38cff8a0f4e1c78' "$base/xp1ER6K.jpg"
          check 'jquery-latest.min.js.download' '739c4501c8bb6da5564a8bb00a94df9f617662b8619133a6f0b567a7ac82694d' "$base/jquery-latest.min.js" 'https://code.jquery.com/jquery-1.11.1.min.js' 'https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js'
          check 'js' '81f780b6d2d426d2e293f0806ea19f402490575f19b5d1b1f2ae32ab934e66f6' "$base/js" 'https://www.googletagmanager.com/gtag/js?id=G-4JTHD1T1H0'
          check 'v4513226cdae34746b4dedf0b4dfa099e1781791509496' '8dd7b15a8893aff7138f89356f5c9f065e26eb1a766b2171bef088137dc2a0f8' "$base/v4513226cdae34746b4dedf0b4dfa099e1781791509496" 'https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source-match-results
          git commit -m 'Record exact supplied asset source matches'
          git push origin HEAD:main
