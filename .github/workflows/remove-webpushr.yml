name: Remove Webpushr
on:
  push:
    paths:
      - '.github/workflows/remove-webpushr.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Webpushr only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('index.html'), Path('Samu Kyautar 30GB Data A Kowane Layi.html')]
          pattern = re.compile(r'\n?\s*<!-- start webpushr code -->.*?<!-- end webpushr code -->\s*', re.S | re.I)
          propush = '<meta name="pushsdk" content="4231f92d269d1c68d43ca7ca0f4b4a4f">'

          for p in targets:
              text = p.read_text(encoding='utf-8')
              if 'webpushr' in text.lower():
                  text, n = pattern.subn('\n', text, count=1)
                  if n != 1:
                      raise SystemExit(f'Webpushr block marker not found exactly once in {p}')
              if p.name == 'index.html' and propush not in text:
                  raise SystemExit('ProPush verification tag missing from index.html')
              p.write_text(text, encoding='utf-8')

          sw = Path('webpushr-sw.js')
          if sw.exists():
              sw.unlink()
          PY
      - name: Commit exact removal and remove helper
        run: |
          rm -f .github/workflows/remove-webpushr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Webpushr integration'
          git push origin HEAD:main
