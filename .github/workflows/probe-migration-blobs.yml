name: Probe migration blobs

on:
  push:
    branches: [main]
    paths:
      - '.blob-probe-trigger'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check expected orphan blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/blob-list <<'EOF'
