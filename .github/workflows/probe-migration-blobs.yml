          EOF

          : > .blob-found
          : > .blob-misses
          while read -r idx sha; do
            code=$(curl -sS -o /tmp/blob.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha")
            if [ "$code" = "200" ]; then
              echo "$idx $sha" >> .blob-found
            else
              echo "$idx $sha" >> .blob-misses
            fi
          done < /tmp/blob-list

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .blob-found .blob-misses
          git commit -m 'Record migration blob availability'
          git push
