name: Export current source page

on:
  push:
    branches: [main]
    paths:
      - '.export-page-trigger'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current source page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          curl -fL --retry 2 --connect-timeout 10 -A 'Mozilla/5.0' 'https://25gb-anniversary-data.altcore.online/' -o /tmp/export/page.html
          sha256sum /tmp/export/page.html
          stat -c '%s' /tmp/export/page.html
      - name: Upload fetched page
        uses: actions/upload-artifact@v4
        with:
          name: current-source-page
          path: /tmp/export/page.html
          if-no-files-found: error
          compression-level: 0
