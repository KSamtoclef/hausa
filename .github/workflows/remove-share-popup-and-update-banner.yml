name: Remove share popup and update banner

on:
  push:
    paths:
      - '.github/workflows/remove-share-popup-and-update-banner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch both HTML entry files
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('Samu Kyautar 30GB Data A Kowane Layi.html'),
          ]

          old_image = './977A9CCB-011E-4F18-937E-EF7C46E988B9.png'
          new_image = './AA3F0E76-7B63-49B4-A39F-D48AB23A22FB.png'

          for path in files:
              text = path.read_text(encoding='utf-8')

              if old_image not in text and new_image not in text:
                  raise SystemExit(f'{path}: main banner reference not found')

              text = text.replace(old_image, new_image)

              # Remove only the share-flow "Something is wrong" alert calls.
              text = text.replace('alert(error);', '')
              text = text.replace('alert%28error%29%3B', '')

              if 'alert(error);' in text or 'alert%28error%29%3B' in text:
                  raise SystemExit(f'{path}: share popup alert still present')
              if new_image not in text:
                  raise SystemExit(f'{path}: new banner was not applied')

              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Samu Kyautar 30GB Data A Kowane Layi.html"
          git rm .github/workflows/remove-share-popup-and-update-banner.yml
          git commit -m "Remove share popup and use new banner"
          git push origin HEAD:main
