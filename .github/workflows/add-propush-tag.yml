name: "Add ProPush tag"
"on":
  push:
    paths:
      - ".github/workflows/add-propush-tag.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tag
        env:
          TAG_B64: ""
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='p2pdh.com/026/549c4/mw.min.js?z=11558965'
          if marker not in s:
              tag=base64.b64decode(os.environ['TAG_B64']).decode()
              if '<body>' not in s:
                  raise SystemExit('body tag not found')
              p.write_text(s.replace('<body>','<body>\n'+tag,1))
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/add-propush-tag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-propush-tag.yml
          git commit -m "Add ProPush subscriber tag" || exit 0
          git push
