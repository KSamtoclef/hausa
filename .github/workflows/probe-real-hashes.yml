name: Probe real supplied hashes

on:
  push:
    branches: [main]
    paths: ['.probe-real-hashes-trigger']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe and cache exact external copies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .real-cache
          mkdir -p .real-cache
          : > .real-probe-results
          check() {
            name="$1"; expected="$2"; shift 2
            ok=''
            for url in "$@"; do
              rm -f /tmp/x
              if curl -fsSL --retry 1 --connect-timeout 10 "$url" -o /tmp/x; then
                actual="$(sha256sum /tmp/x | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  cp /tmp/x ".real-cache/$name"
                  printf '%s|MATCH|%s\n' "$name" "$url" >> .real-probe-results
                  ok=1
                  break
                fi
              fi
            done
            if [ -z "$ok" ]; then printf '%s|MISS\n' "$name" >> .real-probe-results; fi
          }
          base='https://25gb-anniversary-data.altcore.online'
          check '25.png' '0186ef7eb7181b66aaf8565acc8ea9d83b7a1307db06561858d8ce66c5295a32' "$base/25.png"
          check 'jquery-latest.min.js.download' '540bc6e5724079cd71ea4e72a2bc1f67ef2f6fe59ad0eb4814dd3525ac46f41f' "$base/jquery-latest.min.js" 'https://code.jquery.com/jquery-1.11.1.min.js' 'https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js'
          check 'js' '5053a44bc0cd29ba0890f34686e9642861575fb73f6f38cff8a0f4e1c78bea3' "$base/js" 'https://www.googletagmanager.com/gtag/js?id=G-4JTHD1T1H0'
          check 'v4513226cdae34746b4dedf0b4dfa099e1781791509496' 'e1ac7d6bb3f8916e3eac8078e341d207e84cd6f0fc90c31d2f5e65640f5e0fbf' "$base/v4513226cdae34746b4dedf0b4dfa099e1781791509496" 'https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .real-cache .real-probe-results
          git commit -m 'Cache real checksum-matched supplied assets'
          git push origin HEAD:main
