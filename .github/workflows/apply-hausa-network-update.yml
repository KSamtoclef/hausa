name: Finish Hausa network cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-hausa-network-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix remaining MTN-only share phrase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('Samu Kyautar 30GB Data A Kowane Layi.html')]
          old = '*Yadda zaku samu wannan kyautar data daga MTN.*'
          new = '*Yadda zaku samu wannan kyautar data daga MTN, Airtel ko Glo.*'
          for path in files:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected remaining MTN-only share phrase not found')
              path.write_text(text.replace(old, new), encoding='utf-8')
          if files[0].read_bytes() != files[1].read_bytes():
              raise SystemExit('HTML files diverged')
          PY

      - name: Verify and clean workflow
        shell: bash
        run: |
          grep -q 'Yadda zaku samu wannan kyautar data daga MTN, Airtel ko Glo' index.html
          grep -q '<option value="2">Airtel</option>' index.html
          grep -q '<option value="3">Glo</option>' index.html
          grep -q 'Rubuta sharhi' index.html
          rm -f .github/workflows/apply-hausa-network-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Hausa multi-network content update"
          git push origin HEAD:main
