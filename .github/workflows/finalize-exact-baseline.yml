name: Finalize exact baseline

on:
  push:
    branches: [main]
    paths:
      - '.finalize-baseline-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate checksum-matching supplied baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          from html import unescape
          import hashlib, re, shutil, os

          source_url = 'https://25gb-anniversary-data.altcore.online/'
          page_name = 'Samu Kyautar 30GB Data A Kowane Layi.html'
          asset_dir_name = 'Samu Kyautar 30GB Data A Kowane Layi_files'
          target_html_sha = 'cac5301dc0d65d6ef9e817685b1c2284ae58195e93f089aab81e1401504adcb3'

          expected = {
              '0UHB1f0.png': 'ceabbfc35f1d7a9c0f6aa3a02b540b4343015863cb109eb15ff3253da3809376',
              '25.png': '0186ef7eb7181b66aaf8565acc8ea9d83b7a1307db06561858d8ce66c5295a32',
              'D3BlBjV.jpg': '1e48a7664155ba996f433237517509610a383b7339eb76b39883dc52433999a0',
              'KTvWL6j.jpg': '22fcfd691c6e6fb1f7c11a8221a73c85e4df82157a5fcc4788d9f5122207a92e',
              'g6cV61A.png': 'a9e016f11bc71f12128811f0ab6022e4d7f68dc75bde3e931b245a1f41749666',
              'jquery-latest.min.js.download': '739c4501c8bb6da5564a8bb00a94df9f617662b8619133a6f0b567a7ac82694d',
              'js': '81f780b6d2d426d2e293f0806ea19f402490575f19b5d1b1f2ae32ab934e66f6',
              'sSMYbTT.png': '01f4dd5a6f6b5b16917c38b777efca84efe1ca9ccb0829867bcde0f7e398aa85',
              'v4513226cdae34746b4dedf0b4dfa099e1781791509496': '8dd7b15a8893aff7138f89356f5c9f065e26eb1a766b2171bef088137dc2a0f8',
              'xp1ER6K.jpg': 'ce5734493a44bc0cd29ba0890f34686e9642861575fb73f6f38cff8a0f4e1c78',
          }

          def fetch(url):
              req = Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urlopen(req, timeout=20) as r:
                  return r.read()

          raw = fetch(source_url)
          text = raw.decode('utf-8', 'replace')

          urls = set()
          for m in re.finditer(r'''(?i)(?:src|href|content)\s*=\s*["']([^"']+)["']''', text):
              v = unescape(m.group(1).strip())
              if not v or v.startswith(('data:','javascript:','#','mailto:','tel:')):
                  continue
              if v.startswith('//'):
                  v = 'https:' + v
              urls.add(urljoin(source_url, v))
          for m in re.finditer(r'''https?://[^\s"'<>]+''', text):
              urls.add(unescape(m.group(0).rstrip(');,]')))

          # Explicit candidates corresponding only to supplied files.
          for name in expected:
              urls.add(urljoin(source_url, name.replace('.download','')))
              urls.add(urljoin(source_url, name))
          urls.update({
              'https://code.jquery.com/jquery-1.11.1.min.js',
              'https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js',
              'https://www.googletagmanager.com/gtag/js?id=G-4JTHD1T1H0',
              'https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496',
          })

          by_hash = {}
          source_for = {}

          # Reuse checksum-gated cache produced earlier where available.
          cache = Path('.source-cache')
          if cache.exists():
              for p in cache.iterdir():
                  if p.is_file():
                      b = p.read_bytes()
                      h = hashlib.sha256(b).hexdigest()
                      by_hash.setdefault(h, b)
                      source_for.setdefault(h, None)

          for url in sorted(urls):
              if all(h in by_hash for h in expected.values()):
                  break
              try:
                  b = fetch(url)
              except Exception:
                  continue
              h = hashlib.sha256(b).hexdigest()
              if h in expected.values() and h not in by_hash:
                  by_hash[h] = b
                  source_for[h] = url

          missing = [name for name,h in expected.items() if h not in by_hash]
          if missing:
              raise SystemExit('Missing checksum-matched supplied assets: ' + ', '.join(missing))

          asset_dir = Path(asset_dir_name)
          asset_dir.mkdir(parents=True, exist_ok=True)
          for name,h in expected.items():
              b = by_hash[h]
              if hashlib.sha256(b).hexdigest() != h:
                  raise SystemExit('Asset checksum verification failed: ' + name)
              (asset_dir / name).write_bytes(b)

          # Build URL -> local path mappings only when the downloaded bytes match a supplied asset.
          mappings = {}
          for name,h in expected.items():
              src = source_for.get(h)
              if src:
                  mappings[src] = f'./{asset_dir_name}/{name}'
              # Also cover source-relative forms that Chrome may have rewritten when saving.
              mappings[urljoin(source_url, name)] = f'./{asset_dir_name}/{name}'
              mappings[urljoin(source_url, name.replace('.download',''))] = f'./{asset_dir_name}/{name}'

          def localize(s):
              out = s
              # Replace longer URLs first.
              for src,dst in sorted(mappings.items(), key=lambda kv: len(kv[0]), reverse=True):
                  out = out.replace(src, dst)
                  out = out.replace(src.replace('&','&amp;'), dst)
              # Match any remaining resource URL by fetching it and comparing its content hash.
              attrs = list(re.finditer(r'''(?i)(src|href|content)\s*=\s*(["'])([^"']+)\2''', out))
              replacements = []
              for m in attrs:
                  val = unescape(m.group(3))
                  if val.startswith(('./'+asset_dir_name+'/', 'data:', 'javascript:', '#', 'mailto:', 'tel:')):
                      continue
                  u = 'https:' + val if val.startswith('//') else urljoin(source_url, val)
                  try:
                      b = fetch(u)
                  except Exception:
                      continue
                  h = hashlib.sha256(b).hexdigest()
                  for name,eh in expected.items():
                      if h == eh:
                          replacements.append((m.start(3), m.end(3), f'./{asset_dir_name}/{name}'))
                          break
              for a,b,v in reversed(replacements):
                  out = out[:a] + v + out[b:]
              return out

          base = localize(text)
          base = re.sub(r'(?is)(<title[^>]*>).*?(</title>)', r'\1Demo - Samu Kyautar 30GB Data A Kowane Layi\2', base, count=1)

          nl = '\r\n' if '\r\n' in text else '\n'
          saved = f'<!-- saved from url=({len(source_url):04d}){source_url} -->'
          ctype = '<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">'

          candidates = []
          def add(v):
              if v not in candidates:
                  candidates.append(v)
          add(base)
          # Chrome Complete Webpage common insertions.
          if re.search(r'(?is)<!doctype[^>]*>', base):
              add(re.sub(r'(?is)(<!doctype[^>]*>)', r'\1'+nl+saved, base, count=1))
          else:
              add(saved + nl + base)

          first_round = list(candidates)
          for v in first_round:
              if re.search(r'(?is)<head[^>]*>', v):
                  add(re.sub(r'(?is)(<head[^>]*>)', r'\1'+ctype, v, count=1))
                  add(re.sub(r'(?is)(<head[^>]*>)', r'\1'+nl+ctype, v, count=1))

          # Try LF/CRLF variants because Save Page may preserve response line endings.
          for v in list(candidates):
              add(v.replace('\r\n','\n'))
              add(v.replace('\r\n','\n').replace('\n','\r\n'))

          chosen = None
          for v in candidates:
              b = v.encode('utf-8')
              if hashlib.sha256(b).hexdigest() == target_html_sha:
                  chosen = b
                  break

          if chosen is None:
              # Do not silently substitute a rewritten page for the supplied snapshot.
              hashes = ','.join(hashlib.sha256(v.encode('utf-8')).hexdigest() for v in candidates)
              raise SystemExit('Supplied HTML exact-hash reconstruction did not match. Candidate hashes: '+hashes)

          Path(page_name).write_bytes(chosen)
          if hashlib.sha256(Path(page_name).read_bytes()).hexdigest() != target_html_sha:
              raise SystemExit('Final HTML checksum verification failed')
          PY

          # Final manifest checks for the supplied baseline.
          echo 'cac5301dc0d65d6ef9e817685b1c2284ae58195e93f089aab81e1401504adcb3  Samu Kyautar 30GB Data A Kowane Layi.html' | sha256sum -c -
          echo '0186ef7eb7181b66aaf8565acc8ea9d83b7a1307db06561858d8ce66c5295a32  Samu Kyautar 30GB Data A Kowane Layi_files/25.png' | sha256sum -c -

      - name: Commit clean baseline and restore branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-cache .source-cache-misses .source-match-results .source-probe .source-probe-record .source-cache-trigger .finalize-baseline-trigger .migration-init .payload .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Baseline original duplicate'
          git push origin HEAD:main
          git push origin HEAD:refs/heads/baseline-original-duplicate
