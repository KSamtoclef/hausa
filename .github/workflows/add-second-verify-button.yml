name: Add second verify button safely

on:
  push:
    paths:
      - '.github/workflows/add-second-verify-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add second verify button to both HTML files
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('Samu Kyautar 30GB Data A Kowane Layi.html'),
          ]
          old = '            <button id="offer">VERIFY NOW</button>'
          new = old + '\n            <button id="offer2" type="button" onclick="window.open(abcde, \'_blank\')">VERIFY NOW</button>'

          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'id="offer2"' in text:
                  raise SystemExit(f'{path}: second verify button already exists')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one primary verify button, found {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          a = files[0].read_bytes()
          b = files[1].read_bytes()
          if a != b:
              raise SystemExit('HTML entry files are no longer identical')

          text = files[0].read_text(encoding='utf-8')
          if text.count('id="offer"') != 1 or text.count('id="offer2"') != 1:
              raise SystemExit('Verify button count check failed')
          if 'onclick="window.open(abcde, \'_blank\')"' not in text:
              raise SystemExit('Second button is not wired to the shared final URL variable')

      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Samu Kyautar 30GB Data A Kowane Layi.html"
          git rm .github/workflows/add-second-verify-button.yml
          git commit -m "Add second Verify Now button"
          git push origin HEAD:main
